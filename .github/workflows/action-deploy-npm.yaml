name: Release and Publish
on:
  workflow_dispatch:
  workflow_call:
  release:
    types:
      - released

# One run per branch, and it is left to finish. This one publishes,
# and a publish interrupted half way through is worse than a publish
# that waited.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  checks: write
  id-token: write

jobs:
  Test:
    uses: ./.github/workflows/action-test.yaml

  Publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ['Test']
    # npm trusted publishing: GitHub's OIDC token proves this workflow is the
    # package's configured publisher, so no npm token is stored anywhere, and
    # npm adds provenance on its own.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global --ignore-scripts npm@^11.5.1

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
